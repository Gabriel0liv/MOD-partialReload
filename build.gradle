plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // Do not add the mapped Forge source archive as javac's source path: the
    // AT-transformed binary is the compile-time contract for the bridge.
    options.sourcepath = files("${project.buildDir}/empty-java-sourcepath")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile).configure {
    doFirst {
        def emptySourcePath = file("${project.buildDir}/empty-java-sourcepath")
        emptySourcePath.mkdirs()
        options.sourcepath = files(emptySourcePath)

        // ForgeGradle's mapped source archive declares NamespacedWrapper as
        // package-private even though the AT-transformed binary contract is
        // public.  Supply only that compile-time shape, then remove it from
        // the output so the Forge class remains the runtime implementation.
        def accessStub = file("${project.buildDir}/generated/forge-access/net/minecraftforge/registries/NamespacedWrapper.java")
        accessStub.parentFile.mkdirs()
        accessStub.text = '''package net.minecraftforge.registries;

import com.mojang.serialization.Lifecycle;
import net.minecraft.core.HolderSet;
import net.minecraft.core.MappedRegistry;
import net.minecraft.core.Registry;
import net.minecraft.resources.ResourceKey;
import net.minecraft.tags.TagKey;
import java.util.Map;

public class NamespacedWrapper<T> extends MappedRegistry<T> {
    public volatile Map<TagKey<T>, HolderSet.Named<T>> tags;
    public NamespacedWrapper(ResourceKey<? extends Registry<T>> key, Lifecycle lifecycle, boolean intrusive) {
        super(key, lifecycle, intrusive);
    }
}
'''
        source accessStub.parentFile.parentFile.parentFile.parentFile
    }
    doLast {
        delete file("${project.buildDir}/classes/java/main/net/minecraftforge/registries/NamespacedWrapper.class")
        delete file("${project.buildDir}/generated/forge-access")
    }
}

tasks.register('prepareGameTestStructures', Copy) {
    from('src/test/resources/gameteststructures')
    into('run/gameteststructures')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('prepareGameTestStructures')
}
